<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivea Black &amp; White: all sizes</title>
    <style>
        body { margin: 0; padding: 24px 16px; font-family: system-ui, -apple-system, sans-serif; background: #f4f5f7; color: #1a1a1a; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        p { margin: 0 0 24px; color: #555; font-size: 14px; }
        .grid { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
        figure { margin: 0; }
        figcaption { font-size: 13px; margin-bottom: 8px; }
        figcaption a { color: #0b3d91; }
        iframe { border: 0; display: block; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
    </style>
</head>
<body>
    <h1>NIVEA Black &amp; White</h1>
    <p>Tap a <strong>+</strong> on a bottle to see that product, then tap the card to buy it on Jumia. BUY NOW and the rest of the banner open the NIVEA MEN Black &amp; White roll-on (pack of 3) on Jumia.</p>
    <div class="grid">
        <figure>
            <figcaption>300 × 600 · <a href="index.html?size=300x600">open</a></figcaption>
            <iframe src="index.html?size=300x600" width="300" height="600" scrolling="no" title="300x600 banner"></iframe>
        </figure>
        <figure>
            <figcaption>320 × 480 · <a href="index.html?size=320x480">open</a></figcaption>
            <iframe src="index.html?size=320x480" width="320" height="480" scrolling="no" title="320x480 banner"></iframe>
        </figure>
        <figure>
            <figcaption>300 × 250 · <a href="index.html?size=300x250">open</a></figcaption>
            <iframe src="index.html?size=300x250" width="300" height="250" scrolling="no" title="300x250 banner"></iframe>
        </figure>
    </div>
</body>
</html>
